---
layout: traitors-magic
---
<main class="content-page">
  <header class="page-header">
    <h1 class="page-title">News</h1>
    <hr class="page-divider">
  </header>

  <section class="content-page-content">
    <article class="news-full-item">
      <div class="news-full-date">{{ page.date | date: "%B %Y" }}</div>
      <h2 class="news-full-title">{{ page.title }}</h2>
      <div class="news-full-body md-body">{{ content }}</div>
    </article>

    <nav class="back-nav">
      <a href="{{ '/news/' | relative_url }}">&larr; All News</a>
    </nav>
  </section>
</main>
