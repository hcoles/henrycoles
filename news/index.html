---
layout: traitors-magic
title: News
permalink: /news/
---
<main class="content-page">
  <header class="page-header">
    <h1 class="page-title">News</h1>
    <hr class="page-divider">
  </header>

  <section class="content-page-content">
    {% for post in site.posts %}
    <article class="news-summary-item" id="{{ post.slug }}">
      <div class="news-full-date">{{ post.date | date: "%B %Y" }}</div>
      <h2 class="news-full-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <div class="news-summary-body md-body">{{ post.content | split: '</p>' | first | append: '</p>' }}</div>
      <a href="{{ post.url | relative_url }}" class="read-more">Read more &rarr;</a>
    </article>
    {% endfor %}
  </section>
</main>
