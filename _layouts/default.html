---
# layout: compress
---
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{site.baseurl}}/assets/css/main.css">

        {% seo %}

        {% include favicon.html %}

        <!-- Load fontawesome here for faster loadtimes: https://stackoverflow.com/a/35880730/9523246 -->
        <script type="text/javascript"> (function() { var css = document.createElement('link'); css.href = 'https://use.fontawesome.com/releases/v6.5.2/css/all.css'; css.rel = 'stylesheet'; css.type = 'text/css'; document.getElementsByTagName('head')[0].appendChild(css); })(); </script>
    </head>

    <body>
        <header class="site-header">
            <h1 class="site-title">
                <img src="{{site.baseurl}}/assets/images/crow.svg" alt="">
                <a href="{{site.baseurl}}/">{{site.title}}</a>
            </h1>

            <nav class="site-nav">
                {% include navigation.html %}
            </nav>
        </header>

        <main>
            <article>
                {{ content }}
            </article>
        </main>

        <footer>
          <p class="copy">
            <small> &copy; {{site.title}} {{ site.time | date: '%Y' }}
                    Last updated on {{ site.time | date_to_long_string }}
            </small>
          </p>

        {% include social-footer.html %}

        </footer>

    </body>

</html>
