title: Henry Coles
description: Author of Traitor's Magic
url: ""
baseurl: ""
timezone: UTC
encoding: utf-8

# Build settings
markdown: kramdown
kramdown:
  parse_block_html: true

# Collections
collections:
  posts:
    output: true
    permalink: /news/:year/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - README.md
  - node_modules
  - Dockerfile
  - docker-compose.yml


